    const buttons = document.querySelectorAll('.sms-btn');

    buttons.forEach(btn => {
      btn.addEventListener('click', () => {
        const user = btn.dataset.user;
        const windowDiv = document.getElementById(user);

        // Если окно уже открыто - закрыть его
        if (windowDiv.classList.contains('open')) {
          windowDiv.classList.remove('open');
          windowDiv.innerHTML = '';
          return;
        }

        // Закрыть все окна и очистить
        document.querySelectorAll('.sms-window.open').forEach(w => {
          w.classList.remove('open');
          w.innerHTML = '';
        });

        // Создать содержимое переписки
        const messages = messagesData[user] || [];
        const title = ``;
        const msgsHtml = messages.map(msg => `
          <div class="message">
            <div class="msg-header">
              <span class="sender">${msg.sender}</span>
              <span class="time">${msg.time}</span>
            </div>
            <div class="msg-text">${msg.text}</div>
          </div>
        `).join('');

        windowDiv.innerHTML = title + msgsHtml;
        windowDiv.classList.add('open');
      });
    });
